<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 340px;
        }

        /* 🌟 스크롤 영역 설정 보완 */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            
            /* 스크롤 핵심 속성들 */
            overflow-x: auto;          /* 가로 스크롤 허용 */
            overflow-y: hidden;        /* 세로 스크롤은 절대 방지 */
            scroll-behavior: smooth;   /* 스크롤 이동을 부드럽게 */
        }

        /* 얇고 깔끔한 스크롤바 디자인 */
        .display-container::-webkit-scrollbar {
            height: 5px;
        }
        .display-container::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 10px;
        }
        .display-container::-webkit-scrollbar-track {
            background-color: transparent;
        }

        /* 🌟 숫자가 들어가는 텍스트 레이어 */
        .display {
            color: #f8fafc;
            font-size: 2.5rem;
            text-align: right;
            white-space: nowrap;       /* 숫자가 길어져도 아래로 줄바꿈되지 않음 (가장 중요) */
            display: inline-block;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(1px);
        }

        button.operator {
            background-color: #3b82f6; 
            color: white;
        }

        button.clear {
            background-color: #ef4444; 
            color: white;
        }

        button.equal {
            background-color: #10b981; 
            color: white;
            grid-column: span 2; 
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- 결과창 (가로 스크롤 영역) -->
        <div class="display-container" id="display-container">
            <div class="display" id="result">0</div>
        </div>
        
        <!-- 버튼 배열 -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');

        // 🌟 [보완] 스크롤을 실시간으로 가장 오른쪽으로 밀어주는 함수
        function scrollToRight() {
            // DOM이 업데이트된 후 정확한 스크롤 폭을 계산하기 위해 requestAnimationFrame 사용
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        // 입력값 추가
        function appendValue(value) {
            if (display.textContent === '0' && value !== '.') {
                display.textContent = value;
            } else {
                display.textContent += value;
            }
            scrollToRight(); // 값이 입력될 때마다 스크롤 이동
        }

        // 화면 초기화
        function clearDisplay() {
            display.textContent = '0';
            scrollToRight();
        }

        // 한 글자 지우기 (Backspace)
        function backspace() {
            if (display.textContent.length > 1) {
                display.textContent = display.textContent.slice(0, -1);
            } else {
                display.textContent = '0';
            }
            scrollToRight();
        }

        // 계산 결과 출력
        function calculate() {
            try {
                if (display.textContent) {
                    let expression = display.textContent;
                    let result = eval(expression);
                    
                    if (result % 1 !== 0) {
                        result = parseFloat(result.toFixed(8));
                    }
                    
                    display.textContent = result;
                }
            } catch (error) {
                display.textContent = 'Error';
                setTimeout(clearDisplay, 1500);
            }
            scrollToRight();
        }

        // 키보드 입력 이벤트
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if ((key >= '0' && key <= '9') || key === '.') {
                appendValue(key);
            }
            else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendValue(key);
            }
            else if (key === 'Enter' || key === '=') {
                event.preventDefault(); 
                calculate();
            }
            else if (key === 'Backspace') {
                backspace();
            }
            else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
