<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Animated Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 340px;
        }

        /* 결과창 프레임 */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            overflow-x: auto;          
            overflow-y: hidden;        
            cursor: grab; 
            scroll-behavior: smooth;
        }
        
        .display-container:active {
            cursor: grabbing;
        }

        .display-container::-webkit-scrollbar {
            display: none; 
        }

        /* 결과창 텍스트 레이어 */
        .display {
            color: #f8fafc;
            font-size: 2.3rem;
            white-space: nowrap; 
            display: inline-block;
            margin-left: auto; 
            text-align: right;
        }

        /* 🌟 핵심: 새로 입력된 '마지막 글자'에만 적용될 애니메이션 */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.7) translateY(-8px);
                filter: brightness(1.8);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* 마지막 글자 전용 클래스 */
        .last-char {
            display: inline-block;
            animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #3b82f6; /* 입력되는 순간 순간적으로 파란빛을 띠게 만듦 (옵션) */
            transition: color 0.3s ease;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(1px) scale(0.95);
            filter: brightness(1.4);
            transition: all 0.05s ease;
        }

        button.operator { background-color: #3b82f6; color: white; }
        button.clear { background-color: #ef4444; color: white; }
        button.equal { background-color: #10b981; color: white; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container" id="display-container">
            <div class="display" id="result">0</div>
        </div>
        
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');
        let fullExpression = '0'; // 실제 수식을 저장할 변수

        function autoScrollToRight() {
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        // 🌟 [핵심 변경] 마지막 글자만 분리해서 애니메이션 적용하는 함수
        function renderDisplay(text, isCalculated = false) {
            if (text === '0' || text === 'Error' || isCalculated) {
                // 초기 상태나 에러, 결과 출력 시에는 덩어리로 자연스럽게 출력
                display.innerHTML = `<span>${text}</span>`;
                return;
            }

            // 일반 입력 시: 마지막 글자만 <span class="last-char">로 감싸기
            const normalPart = text.slice(0, -1);
            const lastChar = text.slice(-1);
            
            // 연산자 기호 가독성 변환 (내부 수식은 *, / 이지만 화면에는 ×, ÷ 로 표시)
            let viewNormal = normalPart.replace(/\*/g, '×').replace(/\//g, '÷');
            let viewLast = lastChar.replace(/\*/g, '×').replace(/\//g, '÷');

            display.innerHTML = `${viewNormal}<span class="last-char">${viewLast}</span>`;
            
            // 입력 직후 색상이 서서히 원래 흰색으로 돌아오게 처리
            setTimeout(() => {
                const span = display.querySelector('.last-char');
                if(span) span.style.color = '#f8fafc';
            }, 1500);
        }

        // 입력값 추가
        function appendValue(value) {
            if (fullExpression === '0' && value !== '.') {
                fullExpression = value;
            } else {
                fullExpression += value;
            }
            renderDisplay(fullExpression);
            autoScrollToRight();
        }

        // 화면 초기화
        function clearDisplay() {
            fullExpression = '0';
            renderDisplay(fullExpression);
            autoScrollToRight();
        }

        // 한 글자 지우기
        function backspace() {
            if (fullExpression.length > 1) {
                fullExpression = fullExpression.slice(0, -1);
            } else {
                fullExpression = '0';
            }
            renderDisplay(fullExpression);
            autoScrollToRight();
        }

        // 계산 결과 출력
        function calculate() {
            try {
                if (fullExpression) {
                    let result = eval(fullExpression);
                    
                    if (!isNaN(result) && Math.abs(result) >= 1e12) {
                        fullExpression = BigInt(Math.floor(result)).toString();
                    } else if (result % 1 !== 0) {
                        fullExpression = parseFloat(result.toFixed(8)).toString();
                    } else {
                        fullExpression = result.toString();
                    }
                    
                    renderDisplay(fullExpression, true); // 계산 결과는 일괄 렌더링
                }
            } catch (error) {
                fullExpression = '0';
                renderDisplay('Error');
                setTimeout(clearDisplay, 1500);
            }
            autoScrollToRight();
        }

        // 마우스 휠 및 드래그 스크롤
        container.addEventListener('wheel', (evt) => { evt.preventDefault(); container.scrollLeft += evt.deltaY; });

        let isDown = false, startX, scrollLeft;
        container.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - container.offsetLeft; scrollLeft = container.scrollLeft; });
        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });
        container.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5; 
            container.scrollLeft = scrollLeft - walk;
        });

        // 키보드 입력
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ((key >= '0' && key <= '9') || key === '.') appendValue(key);
            else if (key === '+' || key === '-' || key === '*' || key === '/') appendValue(key);
            else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
            else if (key === 'Backspace') backspace();
            else if (key === 'Escape') clearDisplay();
        });

        // 초기화
        renderDisplay(fullExpression);
    </script>
</body>
</html>
