<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 340px;
        }

        /* 🌟 결과창 바깥 감싸는 틀 (크기 고정) */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            
            /* 핵심: 내부 요소가 넘치면 가로 스크롤 활성화 */
            overflow-x: auto;          
            overflow-y: hidden;        
        }

        /* 스크롤바를 숨겨서 더 깔끔하고 모던한 느낌 주기 (휠이나 드래그는 작동함) */
        .display-container::-webkit-scrollbar {
            display: none; 
        }

        /* 🌟 실제 숫자가 들어가는 텍스트 레이어 */
        .display {
            color: #f8fafc;
            font-size: 2.3rem; /* 긴 숫자 가독성을 위해 살짝 조절 */
            white-space: nowrap; /* 절대 줄바꿈 되지 않고 옆으로 쭉 늘어남 */
            width: 100%;
            text-align: right;
            
            /* 스크롤 작동을 위해 글자가 늘어날 수 있도록 설정 */
            display: block; 
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(1px);
        }

        button.operator {
            background-color: #3b82f6; 
            color: white;
        }

        button.clear {
            background-color: #ef4444; 
            color: white;
        }

        button.equal {
            background-color: #10b981; 
            color: white;
            grid-column: span 2; 
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- 결과창 -->
        <div class="display-container" id="display-container">
            <div class="display" id="result">0</div>
        </div>
        
        <!-- 버튼 배열 -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');

        // 입력이나 계산 직후 포커스를 오른쪽 끝으로 밀어주는 함수
        function autoScrollToRight() {
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        // 입력값 추가
        function appendValue(value) {
            if (display.textContent === '0' && value !== '.') {
                display.textContent = value;
            } else {
                display.textContent += value;
            }
            autoScrollToRight(); // 입력할 때는 자동으로 최신 숫자가 보이게 우측 정렬
        }

        // 화면 초기화
        function clearDisplay() {
            display.textContent = '0';
            autoScrollToRight();
        }

        // 한 글자 지우기 (Backspace)
        function backspace() {
            if (display.textContent.length > 1) {
                display.textContent = display.textContent.slice(0, -1);
            } else {
                display.textContent = '0';
            }
            autoScrollToRight();
        }

        // 계산 결과 출력
        function calculate() {
            try {
                if (display.textContent) {
                    let expression = display.textContent;
                    let result = eval(expression);
                    
                    // 지수 표기법(e+) 대신 일반 숫자로 길게 풀어서 보여주기 위한 처리
                    if (!isNaN(result) && Math.abs(result) >= 1e12) {
                        display.textContent = BigInt(Math.floor(result)).toString();
                    } else if (result % 1 !== 0) {
                        display.textContent = parseFloat(result.toFixed(8));
                    } else {
                        display.textContent = result;
                    }
                }
            } catch (error) {
                display.textContent = 'Error';
                setTimeout(clearDisplay, 1500);
            }
            autoScrollToRight(); // 계산 완료 직후에도 일단 전체 결과의 끝부분이 보이도록 정렬
        }

        // 🌟 마우스 휠로도 가로 스크롤이 가능하게 만드는 이벤트
        container.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            container.scrollLeft += evt.deltaY;
        });

        // 키보드 입력 이벤트
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if ((key >= '0' && key <= '9') || key === '.') {
                appendValue(key);
            }
            else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendValue(key);
            }
            else if (key === 'Enter' || key === '=') {
                event.preventDefault(); 
                calculate();
            }
            else if (key === 'Backspace') {
                backspace();
            }
            else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
