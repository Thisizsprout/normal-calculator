<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Animated Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 340px;
        }

        /* 결과창 프레임 */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            overflow-x: auto;          
            overflow-y: hidden;        
            cursor: grab; 
            scroll-behavior: smooth;
        }
        
        .display-container:active {
            cursor: grabbing;
        }

        .display-container::-webkit-scrollbar {
            display: none; 
        }

        /* 🌟 [수정] 좌우 흔들림 버그를 원천 차단하는 절대 고정 레이아웃 */
        .display {
            color: #f8fafc;
            font-size: 2.3rem;
            white-space: nowrap; 
            display: block;
            width: 100%;
            text-align: right;
            transition: all 0.1s ease;
        }

        /* 🌟 [수정] 입력할 때마다 글자 전체가 부드럽게 밀리도록 애니메이션 변경 */
        .push-animation {
            animation: textPush 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }

        @keyframes textPush {
            0% {
                transform: scale(0.98) translateX(4px);
                filter: brightness(1.3);
            }
            100% {
                transform: scale(1) translateX(0);
                filter: brightness(1);
            }
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(1px) scale(0.95);
            filter: brightness(1.4);
            transition: all 0.05s ease;
        }

        button.operator { background-color: #3b82f6; color: white; }
        button.clear { background-color: #ef4444; color: white; }
        button.equal { background-color: #10b981; color: white; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container" id="display-container">
            <!-- 🌟 하나의 클린한 텍스트 노드로 유지 -->
            <div class="display" id="result">0</div>
        </div>
        
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');
        let fullExpression = '0'; 

        function autoScrollToRight() {
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        // 🌟 [수정] 쪼개지 않고 전체에 애니메이션 클래스를 줬다 뺏는 방식으로 전환
        function triggerAnimation() {
            display.classList.remove('push-animation');
            // 브라우저가 클래스 삭제를 인지하도록 한 템포 쉬고 다시 추가 (Reflow 트리거)
            void display.offsetWidth; 
            display.classList.add('push-animation');
        }

        function renderDisplay(text) {
            // 수식 기호 화면 치환
            let viewText = text.replace(/\*/g, '×').replace(/\//g, '÷');
            display.textContent = viewText;
            triggerAnimation(); // 안전하게 애니메이션 실행
        }

        // 입력값 추가
        function appendValue(value) {
            if (fullExpression === '0' && value !== '.') {
                fullExpression = value;
            } else {
                fullExpression += value;
            }
            renderDisplay(fullExpression);
            autoScrollToRight();
        }

        // 화면 초기화
        function clearDisplay() {
            fullExpression = '0';
            renderDisplay(fullExpression);
            autoScrollToRight();
        }

        // 한 글자 지우기
        function backspace() {
            if (fullExpression.length > 1) {
                fullExpression = fullExpression.slice(0, -1);
            } else {
                fullExpression = '0';
            }
            renderDisplay(fullExpression);
            autoScrollToRight();
        }

        // 계산 결과 출력
        function calculate() {
            try {
                if (fullExpression) {
                    let result = eval(fullExpression);
                    
                    if (!isNaN(result) && Math.abs(result) >= 1e12) {
                        fullExpression = BigInt(Math.floor(result)).toString();
                    } else if (result % 1 !== 0) {
                        fullExpression = parseFloat(result.toFixed(8)).toString();
                    } else {
                        fullExpression = result.toString();
                    }
                    
                    renderDisplay(fullExpression);
                }
            } catch (error) {
                fullExpression = '0';
                display.textContent = 'Error';
                setTimeout(clearDisplay, 1500);
            }
            autoScrollToRight();
        }

        // 마우스 휠 및 드래그 스크롤
        container.addEventListener('wheel', (evt) => { evt.preventDefault(); container.scrollLeft += evt.deltaY; });

        let isDown = false, startX, scrollLeft;
        container.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - container.offsetLeft; scrollLeft = container.scrollLeft; });
        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });
        container.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5; 
            container.scrollLeft = scrollLeft - walk;
        });

        // 키보드 입력
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ((key >= '0' && key <= '9') || key === '.') appendValue(key);
            else if (key === '+' || key === '-' || key === '*' || key === '/') appendValue(key);
            else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
            else if (key === 'Backspace') backspace();
            else if (key === 'Escape') clearDisplay();
        });

        // 초기화
        renderDisplay(fullExpression);
    </script>
</body>
</html>
