<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; /* 깊은 다크 블루 배경 */
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 340px;
        }

        /* 가로 스크롤이 가능하도록 input에서 div 구조로 변경 */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow-x: auto; /* 값이 넘치면 가로 스크롤 생성 */
            white-space: nowrap; /* 줄바꿈 방지 */
        }

        /* 스크롤바 디자인 (크롬, 사파리, 웨일 등) */
        .display-container::-webkit-scrollbar {
            height: 6px;
        }
        .display-container::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 10px;
        }
        .display-container::-webkit-scrollbar-track {
            background-color: transparent;
        }

        .display {
            color: #f8fafc;
            font-size: 2.5rem;
            text-align: right;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
        }

        /* 버튼 호버 효과 */
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 기능 연산자 버튼 스타일 (C, =, /, *, -, +) */
        button.operator {
            background-color: #3b82f6; /* 블루 */
            color: white;
        }

        button.clear {
            background-color: #ef4444; /* 레드 */
            color: white;
        }

        button.equal {
            background-color: #10b981; /* 그린 */
            color: white;
            grid-column: span 2; /* = 버튼은 두 칸 차지 */
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- 결과창 (가로 스크롤 지원) -->
        <div class="display-container" id="display-container">
            <div class="display" id="result">0</div>
        </div>
        
        <!-- 버튼 배열 -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');

        // 스크롤을 항상 오른쪽 끝으로 밀어주는 함수
        function scrollToRight() {
            setTimeout(() => {
                container.scrollLeft = container.scrollWidth;
            }, 10);
        }

        // 입력값 추가
        function appendValue(value) {
            if (display.textContent === '0' && value !== '.') {
                display.textContent = value;
            } else {
                display.textContent += value;
            }
            scrollToRight();
        }

        // 화면 초기화 (C 버튼)
        function clearDisplay() {
            display.textContent = '0';
        }

        // 한 글자 지우기 (키보드 Backspace용)
        function backspace() {
            if (display.textContent.length > 1) {
                display.textContent = display.textContent.slice(0, -1);
            } else {
                display.textContent = '0';
            }
        }

        // 계산 결과 출력 (= 버튼)
        function calculate() {
            try {
                if (display.textContent) {
                    // 계산식의 연산자 예외 처리 및 계산
                    let expression = display.textContent;
                    let result = eval(expression);
                    
                    // 소수점이 너무 길어질 경우 처리 (최대 소수점 8자리)
                    if (result % 1 !== 0) {
                        result = parseFloat(result.toFixed(8));
                    }
                    
                    display.textContent = result;
                }
            } catch (error) {
                display.textContent = 'Error';
                setTimeout(clearDisplay, 1500);
            }
            scrollToRight();
        }

        // ⌨️ 키보드 입력 이벤트 리스너 추가
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            // 숫자 및 소수점 체크
            if ((key >= '0' && key <= '9') || key === '.') {
                appendValue(key);
            }
            // 연산자 체크
            else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendValue(key);
            }
            // 엔터키나 느린= 입력 시 계산
            else if (key === 'Enter' || key === '=') {
                event.preventDefault(); // 엔터키의 기본 브라우저 행동 방지
                calculate();
            }
            // 백스페이스 누르면 한 글자 삭제
            else if (key === 'Backspace') {
                backspace();
            }
            // ESC 누르면 전체 초기화
            else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
