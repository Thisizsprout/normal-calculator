<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 340px;
        }

        /* 결과창 프레임 */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            
            /* 가로 스크롤 및 드래그 설정 */
            overflow-x: auto;          
            overflow-y: hidden;        
            cursor: grab; 
        }
        
        .display-container:active {
            cursor: grabbing;
        }

        /* 스크롤바 감추기 */
        .display-container::-webkit-scrollbar {
            display: none; 
        }

        /* 🌟 흔들림 버그 해결의 핵심 */
        .display {
            color: #f8fafc;
            font-size: 2.3rem;
            white-space: nowrap; 
            display: inline-block;
            
            /* 자바스크립트 대신 CSS로 자연스러운 우측 정렬 유지 */
            margin-left: auto; 
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(1px);
        }

        button.operator {
            background-color: #3b82f6; 
            color: white;
        }

        button.clear {
            background-color: #ef4444; 
            color: white;
        }

        button.equal {
            background-color: #10b981; 
            color: white;
            grid-column: span 2; 
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- 결과창 -->
        <div class="display-container" id="display-container">
            <div class="display" id="result">0</div>
        </div>
        
        <!-- 버튼 배열 -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');

        // 입력이나 계산 직후 포커스를 오른쪽 끝으로 밀어주는 함수
        function autoScrollToRight() {
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        // 입력값 추가
        function appendValue(value) {
            if (display.textContent === '0' && value !== '.') {
                display.textContent = value;
            } else {
                display.textContent += value;
            }
            autoScrollToRight();
        }

        // 화면 초기화
        function clearDisplay() {
            display.textContent = '0';
            autoScrollToRight();
        }

        // 한 글자 지우기 (Backspace)
        function backspace() {
            if (display.textContent.length > 1) {
                display.textContent = display.textContent.slice(0, -1);
            } else {
                display.textContent = '0';
            }
            autoScrollToRight();
        }

        // 계산 결과 출력
        function calculate() {
            try {
                if (display.textContent) {
                    let expression = display.textContent;
                    let result = eval(expression);
                    
                    // 큰 숫자 지수 표기법 방지
                    if (!isNaN(result) && Math.abs(result) >= 1e12) {
                        display.textContent = BigInt(Math.floor(result)).toString();
                    } else if (result % 1 !== 0) {
                        display.textContent = parseFloat(result.toFixed(8));
                    } else {
                        display.textContent = result;
                    }
                }
            } catch (error) {
                display.textContent = 'Error';
                setTimeout(clearDisplay, 1500);
            }
            autoScrollToRight();
        }

        // 마우스 휠 스크롤
        container.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            container.scrollLeft += evt.deltaY;
        });

        // 마우스 드래그 스크롤
        let isDown = false;
        let startX;
        let scrollLeft;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
        });
        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });
        container.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5; 
            container.scrollLeft = scrollLeft - walk;
        });

        // 키보드 입력 이벤트
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ((key >= '0' && key <= '9') || key === '.') appendValue(key);
            else if (key === '+' || key === '-' || key === '*' || key === '/') appendValue(key);
            else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
            else if (key === 'Backspace') backspace();
            else if (key === 'Escape') clearDisplay();
        });
    </script>
</body>
</html>
