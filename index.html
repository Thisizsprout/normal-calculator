<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated & Perfect Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; 
        }

        .calculator {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); /* 그림자 더 깊게 */
            width: 340px;
            overflow: hidden; /* 애니메이션이 넘치지 않도록 */
        }

        /* 결과창 프레임 */
        .display-container {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            
            /* 가로 스크롤 및 드래그 설정 */
            overflow-x: auto;          
            overflow-y: hidden;        
            cursor: grab; 
            
            /* 🌟 부드러운 스크롤 효과 */
            scroll-behavior: smooth; 
            transition: background-color 0.3s ease;
        }
        
        .display-container:active {
            cursor: grabbing;
        }

        /* 스크롤바 감추기 */
        .display-container::-webkit-scrollbar {
            display: none; 
        }

        /* 🌟 흔들림 버그 해결 & 애니메이션의 베이스 */
        .display {
            color: #f8fafc;
            font-size: 2.3rem;
            white-space: nowrap; 
            display: inline-block;
            margin-left: auto; 
            text-align: right;
            position: relative; /* 자식 요소 애니메이션 기준 */
        }

        /* 🌟 입력 애니메이션 클래스 */
        @keyframes fadeInSlideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .display span {
            display: inline-block;
            animation: fadeInSlideDown 0.2s ease-out forwards;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease; /* 🌟 버튼 전체 전환 효과 */
            background-color: #334155;
            color: #f8fafc;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1); /* 버튼 그림자 추가 */
            position: relative;
            overflow: hidden;
        }

        /* 🌟 버튼 호버 효과: 살짝 밝아짐 & 올라옴 */
        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        /* 🌟 버튼 클릭 효과: 살짝 눌림 & 더 밝아짐 */
        button:active {
            transform: translateY(1px) scale(0.95); /* scale 추가 */
            filter: brightness(1.4);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.2), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.1s ease; /* 클릭 시 더 빠르게 */
        }

        /* 특수 버튼 스타일 */
        button.operator {
            background-color: #3b82f6; 
            color: white;
        }

        button.clear {
            background-color: #ef4444; 
            color: white;
        }

        button.equal {
            background-color: #10b981; 
            color: white;
            grid-column: span 2; 
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- 결과창 -->
        <div class="display-container" id="display-container">
            <div class="display" id="result">0</div>
        </div>
        
        <!-- 버튼 배열 -->
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const container = document.getElementById('display-container');

        // 입력이나 계산 직후 포커스를 오른쪽 끝으로 밀어주는 함수
        function autoScrollToRight() {
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        // 🌟 애니메이션과 함께 값 업데이트
        function updateDisplayWithAnimation(content) {
            // 기존 내용을 지우고 애니메이션이 적용된 span으로 감싸서 삽입
            display.innerHTML = ''; 
            const span = document.createElement('span');
            span.textContent = content;
            display.appendChild(span);
        }

        // 입력값 추가
        function appendValue(value) {
            let currentContent = display.textContent;
            if (currentContent === '0' && value !== '.') {
                currentContent = value;
            } else {
                currentContent += value;
            }
            updateDisplayWithAnimation(currentContent);
            autoScrollToRight();
        }

        // 화면 초기화
        function clearDisplay() {
            updateDisplayWithAnimation('0');
            autoScrollToRight();
        }

        // 한 글자 지우기 (Backspace)
        function backspace() {
            let currentContent = display.textContent;
            if (currentContent.length > 1) {
                currentContent = currentContent.slice(0, -1);
            } else {
                currentContent = '0';
            }
            updateDisplayWithAnimation(currentContent);
            autoScrollToRight();
        }

        // 계산 결과 출력
        function calculate() {
            try {
                if (display.textContent) {
                    let expression = display.textContent;
                    let result = eval(expression);
                    
                    // 큰 숫자 지수 표기법 방지
                    if (!isNaN(result) && Math.abs(result) >= 1e12) {
                        result = BigInt(Math.floor(result)).toString();
                    } else if (result % 1 !== 0) {
                        result = parseFloat(result.toFixed(8));
                    }
                    
                    updateDisplayWithAnimation(result);
                }
            } catch (error) {
                updateDisplayWithAnimation('Error');
                setTimeout(clearDisplay, 1500);
            }
            autoScrollToRight();
        }

        // 마우스 휠 스크롤
        container.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            container.scrollLeft += evt.deltaY;
        });

        // 마우스 드래그 스크롤
        let isDown = false;
        let startX;
        let scrollLeft;

        container.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
        });
        container.addEventListener('mouseleave', () => { isDown = false; });
        container.addEventListener('mouseup', () => { isDown = false; });
        container.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const walk = (x - startX) * 1.5; 
            container.scrollLeft = scrollLeft - walk;
        });

        // 키보드 입력 이벤트
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ((key >= '0' && key <= '9') || key === '.') appendValue(key);
            else if (key === '+' || key === '-' || key === '*' || key === '/') appendValue(key);
            else if (key === 'Enter' || key === '=') { event.preventDefault(); calculate(); }
            else if (key === 'Backspace') backspace();
            else if (key === 'Escape') clearDisplay();
        });
    </script>
</body>
</html>
